        // 导航逻辑
        function loadPage(pageId) {
            const data = pageContents[pageId] || pageContents['home'];
            document.getElementById('page-title').textContent = data.title;
            document.getElementById('breadcrumb').innerHTML = data.breadcrumb.map(i => `<li>${i}</li>`).join('');
            document.getElementById('content-area').innerHTML = data.content;
            
            // 更新菜单状态
            document.querySelectorAll('.menu-item, .submenu-item').forEach(el => el.classList.remove('active'));
            const activeSub = document.querySelector(`[data-page="${pageId}"]`);
            if (activeSub) activeSub.classList.add('active');
            
            window.scrollTo(0, 0);
        }

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                const sub = this.nextElementSibling;
                if (sub && sub.classList.contains('submenu')) {
                    sub.classList.toggle('active');
                }
                const pageId = this.getAttribute('data-page');
                if (pageId) loadPage(pageId);
            });
        });

        document.querySelectorAll('.submenu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                loadPage(this.getAttribute('data-page'));
            });
        });

        loadPage('home');
    </script>
